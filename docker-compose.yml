services:
  telegram-instagram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Persistent SQLite database storage
      - ./data:/app/data
      # Temporary download directory (cleaned up automatically after delivery)
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
